name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          token: ''
          filters: |
            web:
              - 'packages/web/**'
              - 'packages/core/**'
              - 'pnpm-lock.yaml'
            cli:
              - 'packages/cli/**'
              - 'packages/core/**'
              - 'packages/presets/**'
              - 'asset-release.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/cli-release-candidate.yml'
              - '.github/workflows/publish.yml'

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:boundaries
      - run: pnpm typecheck
      - run: pnpm test

  cli-package:
    name: CLI package (ubuntu-latest)
    needs: [unit, changes]
    if: needs.changes.outputs.cli == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lpc-toolkit/cli typecheck
      - run: pnpm --filter @lpc-toolkit/cli test
      - run: pnpm --filter @lpc-toolkit/cli build
      - run: pnpm --filter @lpc-toolkit/cli test:package

  e2e:
    name: E2E (web)
    needs: [unit, changes]
    if: needs.changes.outputs.web == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @lpc-toolkit/web exec playwright install --with-deps chromium

      - run: pnpm --filter @lpc-toolkit/web test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/web/playwright-report/
          retention-days: 7

  e2e-parity:
    name: E2E parity (web)
    needs: [unit, changes]
    if: needs.changes.outputs.web == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated upstream parity path
        run: echo "LPC_UPSTREAM_PARITY_DIR=$RUNNER_TEMP/lpc-toolkit-upstream-parity" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Materialize pinned upstream parity checkout
        shell: bash
        run: |
          SOURCE_REPOSITORY="$(node -p "require('./asset-release.json').sourceRepository")"
          SOURCE_SHA="$(node -p "require('./asset-release.json').sourceSha")"
          git init "$LPC_UPSTREAM_PARITY_DIR"
          git -C "$LPC_UPSTREAM_PARITY_DIR" remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
          git -C "$LPC_UPSTREAM_PARITY_DIR" fetch --depth=1 origin "$SOURCE_SHA"
          git -C "$LPC_UPSTREAM_PARITY_DIR" checkout --detach FETCH_HEAD
          ACTUAL_SHA="$(git -C "$LPC_UPSTREAM_PARITY_DIR" rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$SOURCE_SHA"
      - name: Install isolated upstream dependencies from lockfile
        run: npm ci --prefix "$LPC_UPSTREAM_PARITY_DIR"

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @lpc-toolkit/web exec playwright install --with-deps chromium

      - run: pnpm --filter @lpc-toolkit/web test:e2e:parity

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-parity-report
          path: packages/web/playwright-report/
          retention-days: 7
